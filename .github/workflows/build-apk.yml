name: Build Android APK
on:
  workflow_dispatch:      # run it by hand: Actions tab -> "Build Android APK" -> Run workflow
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's runners already include the Android SDK. We only need to accept its licenses so
      # Gradle can download any missing platform/build-tools by itself.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
      - run: npm ci --no-audit --no-fund
      - name: Tests (logic + type-check)
        run: npm run typecheck && npm test
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: focusmate-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
